
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: sans-serif;
    background: linear-gradient(135deg, #89f7fe, #a18cd1);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.profile {
    background: white;
    width: 100%;
    max-width: 450px;
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.profile:hover {
    transform: translateY(-8px);
}

.profile img {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    object-fit: cover;
    border: 6px solid #a18cd1;
    box-shadow: 0 5px 15px #ccc;
}

h1 {
    color: #8054b8;
    margin-top: 20px;
    font-size: 30px;
}

.subtitle {
    color: #888;
    margin: 10px 0 25px;
}

.info {
    background: #f5f0ff;
    padding: 13px;
    border-radius: 12px;
    margin: 10px 0;
    text-align: left;
    color: #555;
    transition: 0.3s;
}

.info:hover {
    background: #e7dcff;
    transform: scale(1.03);
}

.info span {
    color: #8054b8;
    font-weight: bold;
}

.footer {
    margin-top: 25px;
    color: #8054b8;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="profile">

    <!-- เปลี่ยน myphoto.jpg เป็นชื่อรูปของตัวเอง -->
    <img src="myphoto.jpg" alt="รูปโปรไฟล์">

    <h1>👋 สวัสดีครับ</h1>
    <p class="subtitle">ยินดีต้อนรับเข้าสู่เว็บไซต์ของผม</p>

    <div class="info">
        <span>👤 ชื่อ :</span> ทวีโชค ทองผึ้ง
    </div>

    <div class="info">
        <span>💗 ชื่อเล่น :</span> กอล์ฟ
    </div>

    <div class="info">
        <span>🎂 อายุ :</span> 18
    </div>

    <div class="info">
        <span>🏫 วิทยาลัย :</span> วิทยาลัยเทคนิกสิงห์บุรี
    </div>

    <div class="info">
        <span>🎮 งานอดิเรก :</span> เล่นเกม ฟังเพลง
    </div>

    <div class="info">
        <span>⭐ ความสามารถ :</span> ตัดต่อ
    </div>

    <div class="footer">
        💜 THANK YOU FOR VISITING MY PROFILE 💜
    </div>

</div>

</body>
</html>
