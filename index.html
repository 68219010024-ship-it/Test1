
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว</title>
    <style>
        body {
            font-family: sans-serif;
            background: #e3f2fd;
            text-align: center;
            padding: 30px;
        }
        .profile {
            background: white;
            padding: 25px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 10px #aaa;
        }
        img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2196f3;
        }
        h1 { color: #1976d2; }
    </style>
</head>
<body>

    <div class="profile">
        <!-- ใส่ชื่อไฟล์รูปของตัวเองตรงนี้ -->
        <img src="myphoto.jpg" alt="รูปประจำตัว">

        <h1>ประวัติส่วนตัว</h1>
        <p>สวัสดีครับ</p>
        <p>ชื่อ : ทวีโชค ทองผึ้ง</p>
        <p>ชื่อเล่น : กอล์ฟ</p>
        <p>อายุ : 17</p>
        <p>โรงเรียน : วิทยาลัยเทคนิกสิงห์บุรี</p>
        <p>งานอดิเรก : เล่นเกม ฟังเพลง</p>
        <p>ความสามารถพิเศษ : เล่นเกม</p>

        <h3>ยินดีที่ได้รู้จักครับ 😊</h3>
    </div>

</body>
</html>
